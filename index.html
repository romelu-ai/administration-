<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>アンケート管理画面</title>

<link
  rel="preconnect"
  href="https://fonts.googleapis.com"
>

<link
  href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap"
  rel="stylesheet"
>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>


<style>

:root{

  --paper:#F6F1E6;
  --paper-line:#DCD2BB;
  --ink:#23282E;
  --ink-soft:#5B5647;
  --stamp:#B23A2E;
  --stamp-soft:#E9D9CE;
  --ok:#55684A;

}

*{
  box-sizing:border-box;
}

html,
body{

  margin:0;
  padding:0;

}

body{

  background:var(--paper);
  color:var(--ink);

  font-family:
    'Zen Kaku Gothic New',
    sans-serif;

  line-height:1.7;

  min-height:100vh;

}

.wrap{

  max-width:800px;

  margin:0 auto;

  padding:40px 20px 80px;

}

header{

  border-bottom:
    1px solid var(--paper-line);

  padding-bottom:20px;

  margin-bottom:30px;

}

h1{

  font-family:
    'Shippori Mincho',
    serif;

  font-size:26px;

  margin:0 0 8px;

}

.lead{

  color:var(--ink-soft);

  font-size:14px;

  margin:0;

}


/* ============================================================
   ログイン
   ============================================================ */

.login-card{

  background:#fff;

  border:
    1px solid var(--paper-line);

  padding:30px 24px;

  max-width:500px;

  margin:40px auto;

}

.login-card label{

  display:block;

  font-size:14px;

  font-weight:700;

  margin-bottom:7px;

}

input[type=password]{

  width:100%;

  font-family:inherit;

  font-size:16px;

  padding:11px 12px;

  background:var(--paper);

  border:
    1px solid var(--paper-line);

  border-radius:2px;

}

input:focus{

  outline:
    2px solid var(--stamp);

  outline-offset:-1px;

}

button{

  font-family:inherit;

  font-size:15px;

  font-weight:700;

  color:#fff;

  background:var(--stamp);

  border:none;

  border-radius:2px;

  padding:12px 28px;

  cursor:pointer;

}

button:disabled{

  background:#B9AFA0;

  cursor:not-allowed;

}

.login-button{

  margin-top:20px;

  width:100%;

}

.error{

  color:var(--stamp);

  font-size:13px;

  margin-top:12px;

}


/* ============================================================
   管理画面
   ============================================================ */

#admin-area{

  display:none;

}

.summary{

  background:#fff;

  border:
    1px solid var(--paper-line);

  padding:20px;

  margin-bottom:25px;

  display:flex;

  justify-content:space-between;

  align-items:center;

  gap:20px;

}

.summary-number{

  font-family:
    'Shippori Mincho',
    serif;

  font-size:30px;

  font-weight:700;

  color:var(--stamp);

}

.summary-label{

  color:var(--ink-soft);

  font-size:13px;

}

.refresh-button{

  background:var(--ok);

  padding:9px 18px;

  font-size:13px;

}


/* ============================================================
   番号一覧
   ============================================================ */

.number-card{

  background:#fff;

  border:
    1px solid var(--paper-line);

  margin-bottom:14px;

}

.number-header{

  padding:16px 18px;

  display:flex;

  justify-content:space-between;

  align-items:center;

  cursor:pointer;

}

.number-header:hover{

  background:#FCFAF5;

}

.number-title{

  display:flex;

  align-items:center;

  gap:12px;

}

.number-badge{

  color:var(--stamp);

  background:var(--stamp-soft);

  padding:3px 10px;

  font-family:
    'Shippori Mincho',
    serif;

  font-weight:700;

}

.number-status{

  font-size:13px;

  color:var(--ink-soft);

}

.number-status.complete{

  color:var(--ok);

  font-weight:700;

}

.number-status.incomplete{

  color:var(--stamp);

}

.arrow{

  font-size:13px;

  color:var(--ink-soft);

}

.responses{

  display:none;

  border-top:
    1px dashed var(--paper-line);

  padding:18px;

}

.responses.open{

  display:block;

}


/* ============================================================
   回答
   ============================================================ */

.response{

  background:var(--paper);

  border:
    1px solid var(--paper-line);

  padding:18px;

  margin-bottom:14px;

}

.response:last-child{

  margin-bottom:0;

}

.response-number{

  font-size:12px;

  color:var(--ink-soft);

  margin-bottom:10px;

}

.question{

  font-weight:700;

  font-size:13px;

  margin-top:12px;

}

.answer{

  white-space:pre-wrap;

  font-size:14px;

  margin-top:3px;

}

.date{

  color:var(--ink-soft);

  font-size:11px;

  margin-top:14px;

}

.no-response{

  color:var(--ink-soft);

  font-size:13px;

}

.loading{

  text-align:center;

  padding:50px;

  color:var(--ink-soft);

}

.hidden{

  display:none;

}

@media(max-width:600px){

  .summary{

    align-items:flex-start;

    flex-direction:column;

  }

}

</style>

</head>


<body>


<div class="wrap">


<header>

  <h1>アンケート管理画面</h1>

  <p class="lead">
    番号ごとの回答状況と回答内容を確認できます。
  </p>

</header>


<!-- ==========================================================
     ログイン画面
     ========================================================== -->

<div id="login-area">


  <div class="login-card">


    <label for="admin-password">
      管理者パスワード
    </label>


    <input
      type="password"
      id="admin-password"
      autocomplete="off"
    >


    <button
      type="button"
      class="login-button"
      id="login-button"
    >
      管理画面を開く
    </button>


    <div
      class="error"
      id="login-error"
      style="display:none;"
    ></div>


  </div>

</div>


<!-- ==========================================================
     管理画面
     ========================================================== -->

<div id="admin-area">


  <div class="summary">


    <div>

      <div
        class="summary-number"
        id="submitted-summary"
      >
        -
      </div>

      <div class="summary-label">
        提出済み人数
      </div>

    </div>


    <div>

      <div
        class="summary-number"
        id="answered-summary"
      >
        -
      </div>

      <div class="summary-label">
        回答があった対象人数
      </div>

    </div>


    <div>

      <div
        class="summary-number"
        id="response-total"
      >
        -
      </div>

      <div class="summary-label">
        回答総数
      </div>

    </div>


    <button
      type="button"
      class="refresh-button"
      id="refresh-button"
    >
      最新情報に更新
    </button>


  </div>


  <div
    class="number-card"
    id="unsubmitted-card"
  >

    <div class="number-header">

      <div class="number-title">

        <span class="number-badge">
          未提出
        </span>

        <span
          class="number-status incomplete"
          id="unsubmitted-count"
        >
          -
        </span>

      </div>

    </div>

    <div
      class="responses open"
      id="unsubmitted-list"
    >

      <div class="loading">
        読み込み中…
      </div>

    </div>

  </div>


  <div
    id="results-area"
  >

    <div class="loading">
      読み込み中…
    </div>

  </div>


</div>


</div>


<script>


/* ============================================================
 * Supabase
 * ============================================================ */

const SUPABASE_URL =
  "https://tqvemvvimtsnrmohelnm.supabase.co";


const SUPABASE_ANON_KEY =
  "sb_publishable_TRfm7gxQ7Sdh_8CX85smDw_TG4akfdj";


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
  );


/* ============================================================
 * 現在のパスワード
 * ============================================================ */

let adminPassword = "";


/* ============================================================
 * ログイン
 * ============================================================ */

async function login(){

  const password =
    document
      .getElementById(
        "admin-password"
      )
      .value
      .trim();


  const errorBox =
    document.getElementById(
      "login-error"
    );


  const button =
    document.getElementById(
      "login-button"
    );


  errorBox.style.display =
    "none";


  if(!password){

    errorBox.textContent =
      "パスワードを入力してください。";

    errorBox.style.display =
      "block";

    return;

  }


  button.disabled =
    true;


  button.textContent =
    "確認中…";


  try{


    const {
      data,
      error
    } =
      await supabaseClient.rpc(
        "verify_survey_password",
        {
          p_password:password
        }
      );


    if(error){

      throw error;

    }


    if(data !== true){

      errorBox.textContent =
        "パスワードが正しくありません。";

      errorBox.style.display =
        "block";

      return;

    }


    /* パスワードを一時的に保持 */

    adminPassword =
      password;


    document.getElementById(
      "login-area"
    ).style.display =
      "none";


    document.getElementById(
      "admin-area"
    ).style.display =
      "block";


    await Promise.all([
      loadResults(),
      loadSubmissionStatus()
    ]);


  }catch(err){

    console.error(err);


    errorBox.textContent =
      "ログインに失敗しました。";

    errorBox.style.display =
      "block";


  }finally{

    button.disabled =
      false;

    button.textContent =
      "管理画面を開く";

  }

}


/* ============================================================
 * 提出状況（誰が提出したか／していないか）
 * ============================================================ */

async function loadSubmissionStatus(){

  const listArea =
    document.getElementById(
      "unsubmitted-list"
    );


  try{


    const {
      data,
      error
    } =
      await supabaseClient.rpc(
        "get_submission_status",
        {
          p_password:
            adminPassword
        }
      );


    if(error){

      throw error;

    }


    if(!Array.isArray(data)){

      throw new Error(
        "データ形式が正しくありません。"
      );

    }


    const submittedCount =
      data.filter(
        r => r.submitted
      ).length;


    document.getElementById(
      "submitted-summary"
    ).textContent =
      `${submittedCount} / ${data.length}`;


    const unsubmitted =
      data.filter(
        r => !r.submitted
      );


    document.getElementById(
      "unsubmitted-count"
    ).textContent =
      `${unsubmitted.length} 人`;


    listArea.innerHTML =

      unsubmitted.length === 0

        ?

        `

          <div class="no-response">
            全員提出済みです。
          </div>

        `

        :

        unsubmitted
          .map(
            r =>

              `

                <div class="response">

                  ${escapeHtml(r.number)}番　${escapeHtml(r.name)}

                </div>

              `

          )
          .join("");


  }catch(err){

    console.error(err);


    listArea.innerHTML = `

      <div class="error">
        提出状況の取得に失敗しました。
      </div>

    `;

  }

}


/* ============================================================
 * 回答データ取得
 * ============================================================ */

async function loadResults(){

  const resultsArea =
    document.getElementById(
      "results-area"
    );


  resultsArea.innerHTML = `

    <div class="loading">
      回答を読み込んでいます…
    </div>

  `;


  try{


    const {
      data,
      error
    } =
      await supabaseClient.rpc(
        "get_survey_results",
        {
          p_password:
            adminPassword
        }
      );


    if(error){

      throw error;

    }


    if(!Array.isArray(data)){

      throw new Error(
        "データ形式が正しくありません。"
      );

    }


    renderResults(data);


  }catch(err){

    console.error(err);


    resultsArea.innerHTML = `

      <div class="error">
        回答の取得に失敗しました。
      </div>

    `;

  }

}


/* ============================================================
 * 回答表示
 * ============================================================ */

function renderResults(data){

  const resultsArea =
    document.getElementById(
      "results-area"
    );


  let totalResponses = 0;

  let numbersWithResponses = 0;


  data.forEach(item => {

    totalResponses +=
      Number(
        item.response_count || 0
      );


    if(
      Number(
        item.response_count || 0
      ) > 0
    ){

      numbersWithResponses++;

    }

  });


  document.getElementById(
    "answered-summary"
  ).textContent =
    `${numbersWithResponses} / ${data.length}`;


  document.getElementById(
    "response-total"
  ).textContent =
    totalResponses;


  resultsArea.innerHTML =
    data
      .map(
        item =>
          createNumberCard(item)
      )
      .join("");


  /* 開閉処理 */

  document
    .querySelectorAll(
      ".number-header"
    )
    .forEach(header => {

      header.addEventListener(
        "click",
        () => {

          const targetId =
            header.dataset.target;

          const target =
            document.getElementById(
              targetId
            );


          const arrow =
            header.querySelector(
              ".arrow"
            );


          target.classList.toggle(
            "open"
          );


          arrow.textContent =
            target.classList.contains(
              "open"
            )
              ? "▲"
              : "▼";

        }
      );

    });

}


/* ============================================================
 * 番号カード生成
 * ============================================================ */

function createNumberCard(item){

  const number =
    item.number;


  const assigned =
    Number(
      item.assigned_count || 0
    );


  const responseCount =
    Number(
      item.response_count || 0
    );


  const complete =
    assigned > 0 &&
    responseCount >= assigned;


  const statusClass =
    complete
      ? "complete"
      : "incomplete";


  const statusText =
    assigned === 0

      ? "まだ割り当てなし"

      : `${responseCount} / ${assigned} 回答済み`;


  const responses =
    Array.isArray(
      item.responses
    )
      ? item.responses
      : [];


  const responseHtml =
    responses.length === 0

      ?

      `

        <div class="no-response">
          まだ回答はありません。
        </div>

      `

      :

      responses
        .map(
          (response,index) =>
            createResponseHtml(
              response,
              index
            )
        )
        .join("");


  return `

    <section class="number-card">


      <div
        class="number-header"
        data-target="responses-${number}"
      >


        <div class="number-title">


          <span class="number-badge">
            ${number}番
          </span>


          <span
            class="number-status ${statusClass}"
          >
            ${statusText}
          </span>


        </div>


        <span class="arrow">
          ▼
        </span>


      </div>


      <div
        class="responses"
        id="responses-${number}"
      >

        ${responseHtml}

      </div>


    </section>

  `;

}


/* ============================================================
 * 回答1件を生成
 * ============================================================ */

function createResponseHtml(
  response,
  index
){

  const answers =
    response.answers || {};


  const impression =
    escapeHtml(
      answers.impression || ""
    );


  const goodpoint =
    escapeHtml(
      answers.goodpoint || ""
    );


  const message =
    escapeHtml(
      answers.message || ""
    );


  const submittedAt =
    response.submitted_at
      ? new Date(
          response.submitted_at
        ).toLocaleString(
          "ja-JP"
        )
      : "";


  return `

    <article class="response">


      <div class="response-number">
        回答 ${index + 1}
      </div>


      <div class="question">
        この人の印象
      </div>

      <div class="answer">
        ${impression || "（回答なし）"}
      </div>


      <div class="question">
        良いところ・すごいと思うところ
      </div>

      <div class="answer">
        ${goodpoint || "（回答なし）"}
      </div>


      <div class="question">
        一言メッセージ
      </div>

      <div class="answer">
        ${message || "（回答なし）"}
      </div>


      <div class="date">
        送信日時：${submittedAt}
      </div>


    </article>

  `;

}


/* ============================================================
 * HTMLエスケープ
 *
 * 回答内容をそのままHTMLとして解釈させないための処理
 * ============================================================ */

function escapeHtml(value){

  return String(value)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}


/* ============================================================
 * ボタン
 * ============================================================ */

document
  .getElementById(
    "login-button"
  )
  .addEventListener(
    "click",
    login
  );


document
  .getElementById(
    "refresh-button"
  )
  .addEventListener(
    "click",
    () => {

      loadResults();
      loadSubmissionStatus();

    }
  );


/* Enterキー */

document
  .getElementById(
    "admin-password"
  )
  .addEventListener(
    "keydown",
    (e) => {

      if(e.key === "Enter"){

        e.preventDefault();

        login();

      }

    }
  );


</script>


</body>

</html>
